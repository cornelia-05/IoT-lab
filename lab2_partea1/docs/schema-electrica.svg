  <text x="450" y="265" class="small">R1 · 220 Ω</text>
  <text x="450" y="335" class="small">R2 · 220 Ω</text>
  <text x="725" y="277" class="label">LED1 · stare</text>
  <text x="725" y="347" class="label">LED2 · intermitent</text>
  <text x="603" y="325" class="small">A</text><text x="653" y="325" class="small">K</text>
  <text x="725" y="419" class="label">B1 · comutare</text>
  <text x="725" y="474" class="label">B+ · durată +</text>
  <text x="725" y="529" class="label">B− · durată −</text>
  <text x="475" y="596" class="small">GND comun · bara „−” a breadboardului</text>
  <text x="48" y="671" class="small">Butoane normal deschise, conectate între pin și GND. Rezistențele pull-up sunt interne.</text>
  <text x="48" y="703" class="small">A = anod (picior lung) · K = catod (picior scurt / margine teșită). Fiecare LED are rezistor separat.</text>
</svg>
