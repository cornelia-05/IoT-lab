  <g fill="#263d52">
    <circle cx="600" cy="430" r="4"/><circle cx="664" cy="430" r="4"/>
    <circle cx="600" cy="485" r="4"/><circle cx="664" cy="485" r="4"/>
    <circle cx="600" cy="540" r="4"/><circle cx="664" cy="540" r="4"/>
    <circle cx="975" cy="360" r="5"/><circle cx="975" cy="430" r="5"/>
