;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
reate my electric sketch
lib_deps =
    feilipu/FreeRTOS

; Tick de 1 ms pe Timer1, in loc de watchdog (~16 ms).
; Omit doar FreeRTOSVariant.h implicit; pastrez FreeRTOSConfig.h al bibliotecii.
; Initializarea timerului este in src/rtos_timer.cpp, ISR-ul este cel din port.c.
build_flags =
    -DfreeRTOSVariant_h
    -DconfigTICK_RATE_HZ=1000
    -DportTICK_PERIOD_MS=1
    -DportSCHEDULER_ISR=TIMER1_COMPA_vect
